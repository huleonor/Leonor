# Publishes the app on GitHub Pages (https://huleonor.github.io/Leonor/) when main changes, and on
# demand from the Actions tab. main changes only when he asks for a deploy (CLAUDE.md).
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The voice recorder's onnxruntime-node fetches GPU binaries from GitHub on install; the site
      # never uses them, and a slow GitHub release stopped a deploy (504): skip that download.
      - run: npm ci --onnxruntime-node-install-cuda=skip
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      - run: npm run build
        env:
          BASE_PATH: /Leonor/
      # A link opened deep in the app still finds it.
      - run: cp dist/index.html dist/404.html
      # The workshop's management page (oficina-gestao/), a plain static page beside the app.
      - run: cp -r oficina-gestao dist/oficina-gestao
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
